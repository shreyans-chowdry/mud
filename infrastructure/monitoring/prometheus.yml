global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: mud-api
    static_configs:
      - targets: [api:8000]

  - job_name: mud-indexer
    static_configs:
      - targets: [indexer:9101]
  - job_name: mud-outbox
    static_configs:
      - targets: [outbox:9102]
