name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.8-bookworm
        env:
          POSTGRES_DB: mud_test
          POSTGRES_USER: mud
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U mud -d mud_test' --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.3-bookworm
        ports: ['6379:6379']
    env:
      MUD_DATABASE_URL: postgresql+asyncpg://mud@127.0.0.1:5432/mud_test
      MUD_TEST_DATABASE_URL: postgresql+asyncpg://mud@127.0.0.1:5432/mud_test
      MUD_REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_TELEMETRY_DISABLED: '1'
      CHOKIDAR_USEPOLLING: 'true'
      MUD_SEED_FIXTURES: '1'
      MUD_ELIGIBILITY_FILE: tests/fixtures/eligibility.local.json
      NEXT_PUBLIC_ALLOW_TEST_NETWORKS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci && npm --prefix frontend ci
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.lock && backend/.venv/bin/pip install --no-deps -e backend
      - run: python scripts/init-local.py
      - run: npm run compile && npm run coverage:contracts
      - run: backend/.venv/bin/ruff check backend scripts && backend/.venv/bin/python -m pytest backend/tests --cov=backend/app --cov-report=xml:backend/coverage.xml
      - run: backend/.venv/bin/python scripts/verify_merkle_tree.py tests/fixtures/eligibility.local.json
      - run: npm --prefix frontend run typecheck && npm --prefix frontend run lint && npm --prefix frontend run coverage && npm --prefix frontend run build
      - name: Actual local-chain integration
        run: |
          mkdir -p runtime
          npm run chain > runtime/chain.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545; then break; fi; sleep 1; done
          npm run deploy:local
          MUD_LIVE_TEST=1 backend/.venv/bin/python -m pytest backend/tests/test_live_chain.py backend/tests/test_live_reorg.py
          backend/.venv/bin/alembic -c backend/alembic.ini upgrade head
          MUD_RUN_WORKERS=true backend/.venv/bin/uvicorn app.main:app --port 8000 --no-proxy-headers > runtime/api.log 2>&1 &
          backend/.venv/bin/uvicorn app.fulfillment:app --port 8001 > runtime/fulfillment.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8000/ready; then break; fi; sleep 1; done
          npm run lifecycle
          backend/.venv/bin/python backend/scripts/verify_runtime.py
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            coverage/
            backend/coverage.xml
            frontend/coverage/
            frontend/playwright-report/
            runtime/lifecycle.json
            runtime/postgres-integration.json
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci && npm --prefix frontend ci
      - name: Solidity tooling dependency audit
        run: npm audit --audit-level=high
      - if: ${{ !cancelled() }}
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - if: ${{ !cancelled() }}
        run: pip install pip-audit==2.9.0 slither-analyzer==0.11.3
      - if: ${{ !cancelled() }}
        run: pip-audit -r backend/requirements.lock
      - if: ${{ !cancelled() }}
        run: npm run compile
      - if: ${{ !cancelled() }}
        run: slither . --compile-force-framework hardhat --hardhat-ignore-compile --hardhat-artifacts-directory contracts/artifacts --hardhat-cache-directory contracts/cache --filter-paths 'node_modules|contracts/src/mocks' --fail-high
